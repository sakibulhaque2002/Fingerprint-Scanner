<script type="text/javascript">

// RSA public key used to encrypt fingerprint templates before they leave the browser.
// Mirrors BioEncryptUtil.encryptAsChunksWithRsa on the backend (RSA/ECB/PKCS1Padding, 117-byte chunks).
// Built-in fallback only -- overwritten by applyClientConfig() from config.json's
// client.rsaPublicKeyBase64 once that loads (see loadConfigAndInit() further down).
var SECUGEN_RSA_PUBLIC_KEY_B64 = "MIGfMA0GCSqGSIb3DQEBAQUAA4GNADCBiQKBgQCiyYkrQi8AbaCzeuDjY21D+uy3hLVSRmCkXv6MPrBB/ditNi3w5b6OYm+k1YS5xHR14B80gCmRK2zZCKZJ62xtvch3GWWOJ5OA0cvYOCVWY1c3tG5+EWC6oQj4C6ORE+Oh2jxVPoCJxlCApWIJpESj05LNy3ODvRAqdxSxqzw5TwIDAQAB";
// 117 = 128-byte modulus (this is a 1024-bit key) minus 11 bytes of PKCS1v1.5 padding
// overhead. If config.json's key ever changes to a different key SIZE (not just a
// different 1024-bit key), this must be updated too: chunk size = (bits/8) - 11.
var BIO_ENCRYPT_CHUNK_SIZE = 117;
var BIO_ENCRYPT_CHUNK_SEPARATOR = ";";

function pemWrapPublicKey(base64Key) {
    var lines = base64Key.match(/.{1,64}/g).join("\n");
    return "-----BEGIN PUBLIC KEY-----\n" + lines + "\n-----END PUBLIC KEY-----";
}

/*
    JS port of BioEncryptUtil.encryptAsChunksWithRsa: splits the input into
    117-character chunks, RSA/PKCS1-encrypts each chunk with the public key,
    base64-encodes each encrypted chunk, and joins them with ';'.
*/
function encryptAsChunksWithRsa(compressedText, publicKeyBase64) {
    if (compressedText === null || compressedText === undefined) {
        return null;
    }

    var encrypt = new JSEncrypt();
    encrypt.setPublicKey(pemWrapPublicKey(publicKeyBase64));

    var chunks = [];
    for (var i = 0; i < compressedText.length; i += BIO_ENCRYPT_CHUNK_SIZE) {
        var chunk = compressedText.substring(i, Math.min(i + BIO_ENCRYPT_CHUNK_SIZE, compressedText.length));
        var encryptedChunk = encrypt.encrypt(chunk);
        if (encryptedChunk === false) {
            throw new Error("RSA encryption failed for chunk starting at index " + i);
        }
        chunks.push(encryptedChunk);
    }

    return chunks.join(BIO_ENCRYPT_CHUNK_SEPARATOR);
}

// Built-in fallback only -- overwritten by applyClientConfig() from config.json's
// client.fingers once that loads (see loadConfigAndInit() further down). "part" must
// be one of "little"/"ring"/"middle"/"index"/"thumb", the five shapes the hand-guide
// SVG knows how to draw highlighted (see handGuideSvg()); "mirror" flips the guide
// for a left-hand finger. Standard 0-9 finger index table:
//   0 Left little   1 Left ring   2 Left middle   3 Left index   4 Left thumb
//   5 Right thumb   6 Right index   7 Right middle   8 Right ring   9 Right little
var FINGERS = [
    { value: 0, label: "Left Little Finger", part: "little", mirror: true },
    { value: 1, label: "Left Ring Finger", part: "ring", mirror: true },
    { value: 2, label: "Left Middle Finger", part: "middle", mirror: true },
    { value: 3, label: "Left Index Finger", part: "index", mirror: true },
    { value: 4, label: "Left Thumb Finger", part: "thumb", mirror: true },
    { value: 5, label: "Right Thumb Finger", part: "thumb", mirror: false },
    { value: 6, label: "Right Index Finger", part: "index", mirror: false },
    { value: 7, label: "Right Middle Finger", part: "middle", mirror: false },
    { value: 8, label: "Right Ring Finger", part: "ring", mirror: false },
    { value: 9, label: "Right Little Finger", part: "little", mirror: false }
];

/*
    Built-in fallbacks, used until config.json loads (or if it fails to load,
    or a key is missing from it) -- see applyClientConfig()/loadConfigAndInit()
    further down. serve.py serves config.json's "client" section only; the
    enrollment API URL/credential in its "server" section never reaches here.
*/
var DEFAULT_FINGER_VALUE = 5;
var MATCH_SCORE_THRESHOLD = 100; // "Match Score" threshold, same default the old Verify App demo used
var SGI_BIOSRV_BASE_URL = "https://localhost:8443";
var CAPTURE_TIMEOUT_MS = 10000;
var CAPTURE_QUALITY = 50;
var CAPTURE_WSQ_RATE = 0.75;

var currentFingerIndex = FINGERS.findIndex(function (f) { return f.value === DEFAULT_FINGER_VALUE; });
var scannedFingerprints = []; // per finger: { fingerprint, confirmFingerprint } once both scans match
var scannedImages = [];
var pendingFirstTemplate = []; // per finger: raw (unencrypted) TemplateBase64 from scan 1, awaiting the confirmation scan

/*
    Simple line-art hand icon used as a placement guide before a finger is
    scanned: same base "right hand" drawing for every finger, just with a
    different digit (little/ring/middle/index/thumb) highlighted, then
    flipped horizontally (via CSS transform, not separate artwork) for the
    left hand. Once a real scan comes back its BMP image replaces this and
    the transform is reset to "none".
*/
var HAND_GUIDE_NEUTRAL_FILL = "#d7dfe8";
var HAND_GUIDE_NEUTRAL_STROKE = "#8493a8";
var HAND_GUIDE_HILITE_FILL = "#2f6fed";
var HAND_GUIDE_HILITE_STROKE = "#173f96";
var HAND_GUIDE_PALM_FILL = "#e9edf3";

function handGuideFingerRect(x, y, height, hot) {
    var fill = hot ? HAND_GUIDE_HILITE_FILL : HAND_GUIDE_NEUTRAL_FILL;
    var stroke = hot ? HAND_GUIDE_HILITE_STROKE : HAND_GUIDE_NEUTRAL_STROKE;
    return '<rect x="' + x + '" y="' + y + '" width="15" height="' + height +
        '" rx="7.5" fill="' + fill + '" stroke="' + stroke + '" stroke-width="3"/>';
}

function handGuideSvg(part) {
    var svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 0 140 200">';
    svg += handGuideFingerRect(91, 72, 76, part === "little");   // little
    svg += handGuideFingerRect(72, 48, 100, part === "ring");    // ring
    svg += handGuideFingerRect(53, 40, 108, part === "middle");  // middle
    svg += handGuideFingerRect(34, 60, 88, part === "index");    // index
    svg += '<rect x="-5" y="142" width="54" height="24" rx="12" fill="' +
        (part === "thumb" ? HAND_GUIDE_HILITE_FILL : HAND_GUIDE_NEUTRAL_FILL) + '" stroke="' +
        (part === "thumb" ? HAND_GUIDE_HILITE_STROKE : HAND_GUIDE_NEUTRAL_STROKE) +
        '" stroke-width="3" transform="rotate(35 22 154)"/>';    // thumb
    svg += '<rect x="33" y="108" width="74" height="78" rx="16" fill="' + HAND_GUIDE_PALM_FILL +
        '" stroke="' + HAND_GUIDE_NEUTRAL_STROKE + '" stroke-width="3"/>'; // palm
    svg += '</svg>';
    return svg;
}

/*
    Shows a placement-guide drawing for the given finger so the user can
    tell which finger to place before scanning. Replaced with the real
    scanned image once CallSGIFPGetData returns a capture.
*/
function showFingerGuideImage(fingerIndex) {
    var finger = FINGERS[fingerIndex];
    var img = document.getElementById("FPImage1");
    img.src = "data:image/svg+xml," + encodeURIComponent(handGuideSvg(finger.part));
    img.style.transform = finger.mirror ? "scaleX(-1)" : "none";
}

/*
    Restores a previously captured scan when the user switches back to an
    already-scanned finger via the dropdown.
*/
function showScannedImage(fingerIndex) {
    var img = document.getElementById("FPImage1");
    img.src = "data:image/bmp;base64," + scannedImages[fingerIndex];
    img.style.transform = "none";
}

function updateFingerUI() {
    if (scannedImages[currentFingerIndex]) {
        showScannedImage(currentFingerIndex);
    }
    else {
        showFingerGuideImage(currentFingerIndex);
    }
    updateScanCountLabel();
    updateActionButtonForStage();
}

/*
    Each finger goes: unscanned -> awaiting-confirm (first scan captured,
    waiting on a second scan of the same finger to verify against) ->
    confirmed (the two scans matched and were encrypted into the final pair).
*/
function fingerScanStage(fingerIndex) {
    if (pendingFirstTemplate[fingerIndex]) {
        return "awaiting-confirm";
    }
    if (scannedFingerprints[fingerIndex]) {
        return "confirmed";
    }
    return "unscanned";
}

function updateActionButtonForStage() {
    var stage = fingerScanStage(currentFingerIndex);
    if (stage === "awaiting-confirm") {
        setActionButton("Scan Again to Confirm", true);
    }
    else {
        setActionButton("Scan", true);
    }
}

function updateScanCountLabel() {
    var count = scannedFingerprints.filter(function (t) { return !!t; }).length;
    var label = document.getElementById("scanCountLabel");
    if (label) {
        label.textContent = count + (count === 1 ? " finger scanned" : " fingers scanned");
    }
}

function handleFingerSelectChange() {
    var select = document.getElementById("fingerSelect");
    var value = parseInt(select.value, 10);
    var idx = FINGERS.findIndex(function (f) { return f.value === value; });
    if (idx !== -1) {
        currentFingerIndex = idx;
        updateFingerUI();
    }
}

function setActionButton(text, enabled) {
    var btn = document.getElementById("actionBtn");
    btn.value = text;
    btn.disabled = !enabled;
}

function setEnrollButtonEnabled(enabled) {
    var btn = document.getElementById("enrollBtn");
    if (btn) {
        btn.disabled = !enabled;
    }
}

function handleActionClick() {
    performScan(currentFingerIndex);
}

function performScan(fingerIndex) {
    var userVal = document.getElementById("userName").value.trim();
    if (userVal === "") {
        alert("Please enter User before scanning.");
        return;
    }

    // Captured before the scan starts: decides whether this capture is the
    // first scan of this finger or the confirmation scan to match against it.
    var stage = fingerScanStage(fingerIndex);
    setActionButton("Scanning...", false);

    CallSGIFPGetData(function (result) {
        if (result.ErrorCode == 0) {
            /*  Display BMP data in image tag
                BMP data is in base 64 format
            */
            if (result.BMPBase64 && result.BMPBase64.length > 0) {
                scannedImages[fingerIndex] = result.BMPBase64;
            }

            if (stage === "awaiting-confirm") {
                confirmScan(fingerIndex, result.TemplateBase64);
            }
            else {
                if (stage === "confirmed") {
                    // Re-scanning an already-confirmed finger starts the
                    // whole verify-pair over; drop the old confirmed pair.
                    scannedFingerprints[fingerIndex] = null;
                }
                pendingFirstTemplate[fingerIndex] = result.TemplateBase64;
                showScannedResult();
                updateFingerUI();
            }
        }
        else {
            alert("Fingerprint Capture Error Code:  " + result.ErrorCode + ".\nDescription:  " + ErrorCodeToString(result.ErrorCode) + ".");
            updateFingerUI();
        }
    }, function (status) {
        ErrorFunc(status);
        updateFingerUI();
    });
}

/*
    Matches the just-captured second scan against the first scan of the same
    finger via the local SGIMatchScore service (same endpoint/contract used
    by the old Verify App demo). Only on a successful match are the two raw
    templates individually RSA-encrypted into the final { fingerprint,
    confirmFingerprint } pair; on any failure both raw templates are
    discarded and the user has to scan this finger again from scratch.
*/
function confirmScan(fingerIndex, secondRawTemplate) {
    var firstRawTemplate = pendingFirstTemplate[fingerIndex];
    var finger = FINGERS[fingerIndex];
    setActionButton("Verifying match...", false);

    callSGIMatchScore(firstRawTemplate, secondRawTemplate, function (result) {
        if (result.ErrorCode == 0 && result.MatchingScore >= MATCH_SCORE_THRESHOLD) {
            scannedFingerprints[fingerIndex] = {
                fingerprint: encryptAsChunksWithRsa(firstRawTemplate, SECUGEN_RSA_PUBLIC_KEY_B64),
                confirmFingerprint: encryptAsChunksWithRsa(secondRawTemplate, SECUGEN_RSA_PUBLIC_KEY_B64)
            };
            pendingFirstTemplate[fingerIndex] = null;
            showScannedResult();
            setEnrollButtonEnabled(true);
        }
        else {
            var reason = result.ErrorCode == 0
                ? "the two scans did not match closely enough (score " + result.MatchingScore + ", need " + MATCH_SCORE_THRESHOLD + ")"
                : "the match check failed (error code " + result.ErrorCode + ")";
            alert("Fingerprint confirmation failed: " + reason + ".\nPlease scan the " + finger.label + " again, starting from the first scan.");
            pendingFirstTemplate[fingerIndex] = null;
        }
        updateFingerUI();
    }, function (status) {
        alert("Could not reach the fingerprint match service (SGIBioSrv). Status: " + status);
        pendingFirstTemplate[fingerIndex] = null;
        updateFingerUI();
    });
}

function buildEnrollEntry(fingerIndex) {
    var userVal = document.getElementById("userName").value.trim();
    var finger = FINGERS[fingerIndex];
    var pair = scannedFingerprints[fingerIndex];
    return {
        finger: finger.value,
        user: userVal,
        fingerprint: pair.fingerprint,
        confirmFingerprint: pair.confirmFingerprint
    };
}

function buildScannedEntries() {
    var entries = [];
    for (var i = 0; i < FINGERS.length; i++) {
        if (scannedFingerprints[i]) {
            entries.push(buildEnrollEntry(i));
        }
    }
    return entries;
}

function renderResult(entries) {
    var pre = document.createElement("pre");
    pre.className = "result-textarea";
    pre.textContent = JSON.stringify(entries, null, 3);

    var resultEl = document.getElementById('result');
    resultEl.innerHTML = "";
    resultEl.appendChild(pre);
}

/*
    Shows the JSON for every finger scanned so far. Called right after each
    scan completes so the JSON is always visible immediately below.
*/
function showScannedResult() {
    renderResult(buildScannedEntries());
}

// Same-origin path handled by serve.py, which forwards it server-side to
// the real enrollment API (adding auth there) so the browser never makes
// a cross-origin call and CORS never comes into play.
var ENROLL_API_URL = "/enroll/fingers";

/*
    The Enroll button is available regardless of which finger is currently
    selected. It submits whatever fingerprints have been scanned so far.
*/
function handleEnrollClick() {
    var entries = buildScannedEntries();
    if (entries.length === 0) {
        alert("Scan at least one fingerprint before enrolling.");
        return;
    }
    renderResult(entries);
    submitEnrollment(entries);
}

function submitEnrollment(entries) {
    setEnrollButtonEnabled(false);
    document.getElementById("enrollBtn").value = "Submitting...";

    var xhr = new XMLHttpRequest();
    xhr.open("POST", ENROLL_API_URL, true);
    xhr.setRequestHeader("Content-Type", "application/json");

    xhr.onreadystatechange = function () {
        if (xhr.readyState === 4) {
            if (xhr.status >= 200 && xhr.status < 300) {
                alert("Enrollment submitted successfully.\n" + xhr.responseText);
            }
            else {
                alert("Enrollment API returned an error. Status: " + xhr.status + "\n" + xhr.responseText);
            }
            document.getElementById("enrollBtn").value = "Enroll";
            setEnrollButtonEnabled(true);
        }
    };

    xhr.onerror = function () {
        alert("Failed to reach the local server at " + ENROLL_API_URL + ". Make sure serve.py is running.");
        document.getElementById("enrollBtn").value = "Enroll";
        setEnrollButtonEnabled(true);
    };

    xhr.send(JSON.stringify(entries));
}

function ErrorFunc(status) {

    /*  
        If you reach here, user is probabaly not running the 
        service. Redirect the user to a page where he can download the
        executable and install it. 
    */
    alert("Check if SGIBIOSRV is running; Status = " + status + ":");

}


function CallSGIFPGetData(successCall, failCall) {
    // 8.16.2017 - At this time, only SSL client will be supported.
    var uri = SGI_BIOSRV_BASE_URL + "/SGIFPCapture";

    var xmlhttp = new XMLHttpRequest();
    xmlhttp.onreadystatechange = function () {
        if (xmlhttp.readyState == 4 && xmlhttp.status == 200) {
            fpobject = JSON.parse(xmlhttp.responseText);
            successCall(fpobject);
        }
        else if (xmlhttp.status == 404) {
            failCall(xmlhttp.status)
        }
    }
    var params = "Timeout=" + CAPTURE_TIMEOUT_MS;
    params += "&Quality=" + CAPTURE_QUALITY;
    params += "&licstr=" + encodeURIComponent(secugen_lic);
    params += "&templateFormat=" + "ISO";
    params += "&imageWSQRate=" + CAPTURE_WSQ_RATE;
    xmlhttp.open("POST", uri, true);
    xmlhttp.send(params);

    xmlhttp.onerror = function () {
        failCall(xmlhttp.statusText);
    }
}

/*
    Ported from the old Verify App demo (Secugen-Demo3's matchScore()): sends
    two raw ISO templates to the local SGIMatchScore service and gets back a
    similarity score. Matching happens here, on the raw templates, because
    SGIBioSrv's matcher needs real minutiae geometry -- it can't compare two
    RSA-encrypted blobs. Encryption (encryptAsChunksWithRsa) only happens
    afterwards, once a pair is confirmed as a match.
*/
function callSGIMatchScore(template1, template2, successCall, failCall) {
    var uri = SGI_BIOSRV_BASE_URL + "/SGIMatchScore";

    var xmlhttp = new XMLHttpRequest();
    xmlhttp.onreadystatechange = function () {
        if (xmlhttp.readyState == 4 && xmlhttp.status == 200) {
            var result = JSON.parse(xmlhttp.responseText);
            successCall(result);
        }
        else if (xmlhttp.readyState == 4 && xmlhttp.status == 404) {
            failCall(xmlhttp.status);
        }
    }
    var params = "template1=" + encodeURIComponent(template1);
    params += "&template2=" + encodeURIComponent(template2);
    params += "&licstr=" + encodeURIComponent(secugen_lic);
    params += "&templateFormat=" + "ISO";
    xmlhttp.open("POST", uri, true);
    xmlhttp.send(params);

    xmlhttp.onerror = function () {
        failCall(xmlhttp.statusText);
    }
}


</script>

<script type="text/javascript">
    var viewModeStorageKey = "secugen.webapi.viewMode";

    function setFormAction() {
        // Reserved for older deployments that called this function on load.
    }

    function getSavedViewMode() {
        try {
            return window.localStorage.getItem(viewModeStorageKey) || "mobile";
        }
        catch (e) {
            return "mobile";
        }
    }

    function saveViewMode(mode) {
        try {
            window.localStorage.setItem(viewModeStorageKey, mode);
        }
        catch (e) {
        }
    }

    function applyViewMode(mode) {
        var selectedMode = mode === "desktop" ? "desktop" : "mobile";
        var viewport = document.getElementById("viewportMeta");
        var buttons = document.querySelectorAll(".view-mode-button");

        document.body.className = document.body.className.replace(/\bview-mode-mobile\b|\bview-mode-desktop\b/g, "");
        document.body.className += " view-mode-" + selectedMode;

        if (viewport) {
            viewport.setAttribute("content", selectedMode === "desktop" ? "width=1024" : "width=device-width, initial-scale=1.0");
        }

        for (var i = 0; i < buttons.length; i++) {
            var isActive = buttons[i].getAttribute("data-view-mode") === selectedMode;
            buttons[i].className = buttons[i].className.replace(/\s?active/g, "");
            if (isActive) {
                buttons[i].className += " active";
            }
            buttons[i].setAttribute("aria-pressed", isActive ? "true" : "false");
        }
    }

    function initializeViewModeSwitch() {
        var buttons = document.querySelectorAll(".view-mode-button");
        for (var i = 0; i < buttons.length; i++) {
            buttons[i].onclick = function () {
                var mode = this.getAttribute("data-view-mode");
                saveViewMode(mode);
                applyViewMode(mode);
            };
        }
        applyViewMode(getSavedViewMode());
    }

    /*
        Rebuilds the Finger dropdown's <option> list from FINGERS, so the
        markup can never drift out of sync with whichever fingers ended up
        active -- the built-in fallback list, or config.json's client.fingers.
    */
    function renderFingerSelectOptions() {
        var select = document.getElementById("fingerSelect");
        if (!select) {
            return;
        }
        select.innerHTML = "";
        for (var i = 0; i < FINGERS.length; i++) {
            var finger = FINGERS[i];
            var option = document.createElement("option");
            option.value = finger.value;
            option.textContent = finger.value + " - " + finger.label;
            select.appendChild(option);
        }
    }

    function syncFingerSelectValue() {
        var select = document.getElementById("fingerSelect");
        if (select && FINGERS[currentFingerIndex]) {
            select.value = String(FINGERS[currentFingerIndex].value);
        }
    }

    function initializeSiteShell() {
        setFormAction();
        initializeViewModeSwitch();
        renderFingerSelectOptions();
        syncFingerSelectValue();
        updateFingerUI();
    }

    // nice global area, so that only 1 location, contains this information
    // Overwritten by applyClientConfig() once config.json loads, below.
    var secugen_lic = "";

    /*
        Applies the client-safe settings served from config.json (see
        serve.py, which strips the enrollment API URL/credential out of
        its "server" section before sending this). Any field missing or
        of the wrong type just keeps its built-in fallback value.
    */
    function applyClientConfig(cfg) {
        if (typeof cfg.secugenLicense === "string") {
            secugen_lic = cfg.secugenLicense;
        }
        if (typeof cfg.rsaPublicKeyBase64 === "string" && cfg.rsaPublicKeyBase64 !== "") {
            SECUGEN_RSA_PUBLIC_KEY_B64 = cfg.rsaPublicKeyBase64;
        }
        if (typeof cfg.matchScoreThreshold === "number") {
            MATCH_SCORE_THRESHOLD = cfg.matchScoreThreshold;
        }
        if (typeof cfg.sgiBioSrvBaseUrl === "string" && cfg.sgiBioSrvBaseUrl !== "") {
            SGI_BIOSRV_BASE_URL = cfg.sgiBioSrvBaseUrl;
        }
        if (cfg.capture) {
            if (typeof cfg.capture.timeoutMs === "number") {
                CAPTURE_TIMEOUT_MS = cfg.capture.timeoutMs;
            }
            if (typeof cfg.capture.quality === "number") {
                CAPTURE_QUALITY = cfg.capture.quality;
            }
            if (typeof cfg.capture.imageWsqRate === "number") {
                CAPTURE_WSQ_RATE = cfg.capture.imageWsqRate;
            }
        }
        var VALID_HAND_GUIDE_PARTS = ["little", "ring", "middle", "index", "thumb"];
        if (Array.isArray(cfg.fingers) && cfg.fingers.length > 0) {
            var validFingers = cfg.fingers.filter(function (f) {
                return f && typeof f.value === "number" && typeof f.label === "string";
            }).map(function (f) {
                return {
                    value: f.value,
                    label: f.label,
                    part: (VALID_HAND_GUIDE_PARTS.indexOf(f.part) !== -1) ? f.part : "index", // anything else falls back to "index"
                    mirror: !!f.mirror
                };
            });
            if (validFingers.length > 0) {
                FINGERS = validFingers;
            }
        }
        if (typeof cfg.defaultFingerValue === "number") {
            DEFAULT_FINGER_VALUE = cfg.defaultFingerValue;
        }
        // Re-resolve against the final FINGERS list -- it may have just been
        // replaced above, and/or DEFAULT_FINGER_VALUE may not exist in it.
        var idx = FINGERS.findIndex(function (f) { return f.value === DEFAULT_FINGER_VALUE; });
        currentFingerIndex = (idx !== -1) ? idx : 0;
    }

    /*
        Loads config.json before the rest of the page initializes. Falls
        back to the built-in defaults declared earlier in this file if the
        request fails, times out, or returns invalid JSON -- e.g. if this
        page is opened without serve.py running.
    */
    function loadConfigAndInit() {
        var xhr = new XMLHttpRequest();
        xhr.onreadystatechange = function () {
            if (xhr.readyState === 4) {
                if (xhr.status === 200) {
                    try {
                        applyClientConfig(JSON.parse(xhr.responseText));
                    }
                    catch (e) {
                        console.error("config.json was not valid JSON; using built-in defaults.", e);
                    }
                }
                else {
                    console.error("Could not load config.json (status " + xhr.status + "); using built-in defaults.");
                }
                initializeSiteShell();
            }
        };
        xhr.onerror = function () {
            console.error("Could not load config.json; using built-in defaults.");
            initializeSiteShell();
        };
        xhr.open("GET", "config.json", true);
        xhr.send();
    }

    function ErrorCodeToString(ErrorCode) {
        var Description;
        switch (ErrorCode) {
            // 0 - 999 - Comes from SgFplib.h
            // 1,000 - 9,999 - SGIBioSrv errors
            // 10,000 - 99,999 license errors
            case 1:
                Description = "Creation failed (fingerprint reader not correctly installed or driver files error)";
                break;
            case 2:
                Description = "Function failed (wrong type of fingerprint reader or not correctly installed)";
                break;
            case 3:
                Description = "Internal (invalid parameters to sensor API)";
                break;
            case 5:
                Description = "DLL load failed";
                break;
            case 6:
                Description = "DLL load failed for driver";
                break;
            case 7:
                Description = "DLL load failed for algorithm";
                break;
            case 51:
                Description = "System file load failure";
                break;
            case 52:
                Description = "Sensor chip initialization failed";
                break;
            case 53:
                Description = "Device not found";
                break;
            case 54:
                Description = "Fingerprint image capture timeout";
                break;
            case 55:
                Description = "No device available";
                break;
            case 56:
                Description = "Driver load failed";
                break;
            case 57:
                Description = "Wrong Image";
                break;
            case 58:
                Description = "Lack of bandwidth";
                break;
            case 59:
                Description = "Device Busy";
                break;
            case 60:
                Description = "Cannot get serial number of the device";
                break;
            case 61:
                Description = "Unsupported device";
                break;
            case 63:
                Description = "SgiBioSrv didn't start; Try image capture again";
                break;
            case 101:
                Description = "Very low minutiae count";
                break;
            case 102:
                Description = "Wrong template type";
                break;
            case 103:
                Description = "Invalid template";
                break;
            case 104:
                Description = "Invalid template";
                break;
            case 105:
                Description = "Could not extract features";
                break;
            case 106:
                Description = "Match failed";
                break;
            case 1000:
                Description = "No memory";
                break;
            case 2000:
                Description = "Internal error";
                break;
            case 3000:
                Description = "Internal error extended";
                break;
            case 4000:
                Description = "Invalid parameter passed to service";
                break;
            case 6000:
                Description = "Certificate error, cannot decode";
                break;
            case 10001:
                Description = "License error";
                break;
            case 10002:
                Description = "Invalid domain";
                break;
            case 10003:
                Description = "License expired";
                break;
            case 10004:
                Description = "WebAPI did not receive the Origin header from the browser. This happens when the page is opened directly from disk (a file:// URL) instead of being served over http(s)://. Serve this page from a local web server (e.g. run start-server.bat) and open it via http://localhost:8080/ instead.";
                break;
            default:
                Description = "Unknown error code or Update code to reflect latest result";
                break;
        }
        return Description;
    }

</script>
